<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LittleSU TV - 直播</title>
    <meta name="description" content="LittleSU TV 内置直播源，支持 M3U 频道列表与 HLS 播放。">
    <link rel="icon" href="./image/retrotv_5520.png">
    <link rel="apple-touch-icon" href="./image/retrotv_5520.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="css/live.css">
</head>
<body>
    <header class="live-header">
        <a class="live-back" href="index.html" title="返回首页">&#8592;</a>
        <h1>直播</h1>
        <select id="liveSource" aria-label="直播源"></select>
    </header>

    <main class="live-main">
        <div class="live-player-wrap">
            <div id="livePlayer"></div>
        </div>
        <p id="liveStatus" class="live-status">选择频道开始播放</p>

        <div class="live-controls">
            <input id="liveSearch" type="search" placeholder="搜索频道或分组" autocomplete="off">
            <button id="liveReload" type="button">刷新</button>
        </div>

        <div id="liveGroups" class="live-groups"></div>
        <div id="liveList" class="live-list"></div>
        <div id="liveMore" class="live-more hidden"><button type="button">显示更多</button></div>
    </main>

    <script src="libs/hls.min.js"></script>
    <script src="libs/DPlayer.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/apiUtils.js"></script>
    <script src="js/apiRequestCore.js"></script>
    <script src="js/live-parser.js"></script>
    <script src="js/hls-native-loader.js"></script>
    <script src="js/live.js"></script>
</body>
</html>
